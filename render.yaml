services:
  - type: web
    name: quantum-stock-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app --timeout 180 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
